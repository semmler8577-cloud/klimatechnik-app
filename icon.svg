<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#18284a"/><stop offset=".55" stop-color="#0c1629"/><stop offset="1" stop-color="#070c18"/></linearGradient>
 <radialGradient id="glowC" cx=".5" cy=".45" r=".5"><stop offset="0" stop-color="#3fc8ff" stop-opacity=".30"/><stop offset="1" stop-color="#3fc8ff" stop-opacity="0"/></radialGradient>
 <radialGradient id="glowW" cx=".82" cy=".84" r=".42"><stop offset="0" stop-color="#ff7a32" stop-opacity=".42"/><stop offset="1" stop-color="#ff7a32" stop-opacity="0"/></radialGradient>
 <linearGradient id="ice" gradientUnits="userSpaceOnUse" x1="0" y1="-130" x2="0" y2="130"><stop offset="0" stop-color="#ffffff"/><stop offset=".5" stop-color="#c8f1ff"/><stop offset="1" stop-color="#5ccfff"/></linearGradient>
 <linearGradient id="ring" gradientUnits="userSpaceOnUse" x1="120" y1="110" x2="400" y2="400"><stop offset="0" stop-color="#5cd3ff"/><stop offset=".55" stop-color="#7fd8ff"/><stop offset=".78" stop-color="#ffb35c"/><stop offset="1" stop-color="#ff5f2e"/></linearGradient>
 <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".12"/><stop offset=".45" stop-color="#fff" stop-opacity="0"/></linearGradient>
 <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="10"/></filter>
</defs>
<rect width="512" height="512" rx="114" fill="url(#bg)"/>
<rect width="512" height="512" rx="114" fill="url(#glowC)"/>
<rect width="512" height="512" rx="114" fill="url(#glowW)"/>
<!-- Kreislauf-Ring: kalt -> warm (Wärmepumpe) -->
<g fill="none" stroke-linecap="round">
 <path d="M256 82 A174 174 0 1 1 101 177" stroke="url(#ring)" stroke-width="20" opacity=".35" filter="url(#soft)"/>
 <path d="M256 82 A174 174 0 1 1 101 177" stroke="url(#ring)" stroke-width="16"/>
</g>
<path d="M118 132 L96 186 L152 180 Z" fill="#5cd3ff" stroke="#5cd3ff" stroke-width="6" stroke-linejoin="round"/>
<!-- Schneeflocke -->
<g transform="translate(256 256)" stroke="url(#ice)" stroke-width="19" stroke-linecap="round" stroke-linejoin="round" fill="none">
 <g id="arm"><path d="M0 -38V-118"/><path d="M-30 -92 0 -64 30 -92"/></g>
 <use href="#arm" transform="rotate(60)"/><use href="#arm" transform="rotate(120)"/><use href="#arm" transform="rotate(180)"/><use href="#arm" transform="rotate(240)"/><use href="#arm" transform="rotate(300)"/>
 <circle r="24" stroke-width="13"/>
</g>
<rect width="512" height="512" rx="114" fill="url(#sheen)"/>
<rect x="3" y="3" width="506" height="506" rx="111" fill="none" stroke="#fff" stroke-opacity=".09" stroke-width="6"/>
</svg>
